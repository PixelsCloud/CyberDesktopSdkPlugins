# 人物素材配置（UTF-8 / TOML 1.0）。图片和视频均为独立文件，未编译进程序。
# 可以直接替换 PNG/JPEG/WebP 或修改 file 路径，不需填写哈希、大小、尺寸和视频参数。
# 保存后在人物管理点击「重新加载 TOML」，或重启 Desktop；成功检查全部资源后整体切换。
# 缺图、坏图和错误配置会提示错误并保留旧版本；修正后重新加载，旧聊天引用的图片不受替换影响。
# file 相对于本文件目录，使用 /；不支持绝对路径、..、网络路径和链接文件。
# 图片：PNG/JPEG/WebP 静态图，单张 <=32 MiB，宽高 <=4096；透明人物建议 PNG/WebP。
# 视频：单个 <=128 MiB、<=120 秒、<=1920×1080、<=30 FPS，需 Player 运行库可解码。
# resources.character_id 是包标识；media 中 character_template.id 和 assets.character_id 与其一致。
# 姓名和提示词：修改插件根目录 characters.toml；下方 character_template 用于独立导入此素材包。
# resources.assets 的 id 是资源标识。可改文件名，但请保持 id 及所有引用一致。
# usages：expression=情绪立绘，pose=动作，background=场景背景，media=允许发送给用户。
# emotion 映射大模型情绪：neutral=平静、happy=开心、sad=难过、shy=害羞、angry=生气、
# surprised=惊讶、worried=担心、thoughtful=思考。每种情绪只映射一张，neutral 必须存在。
# pose_wave 对应 wave（挥手），pose_folded 对应 folded（抱臂）；neutral 兼作默认姿态。
# 自定义动作可添加 usages=["pose"] 的图片，例如 id="pose_salute" 对应 salute；名称会自动进入设置。
# 所有 usages=["expression"] 的图片会自动进入表情设置；没有 emotion 的图片以资源 id 显示。
# 设置中的选项随角色、图片包和 Live2D 模型切换；手动选择分别保存，失效时回到「跟随对话」。
# media.scenes：id 为场景标识，name 为名称，file 为背景图，description 提供场景提示。
# media.assets：可发送的图片/视频；tags 用于筛选；collection_id 为相册/集合标识。
# required_flags 为解锁条件，minimum_turns 为最少聊天轮数，maximum_sends 为发送次数上限。
# 可选 enabled=false 禁用；cooldown_ms 设置冷却毫秒数。程序按条件随机选图，大模型不能越权。
# media.rules.relationship_stages 定义关系阶段；events 定义事件；user_confirmation 需用户确认。
# 不在此填写 API Key，连接配置使用应用的连接设置和 Windows 凭据存储。

